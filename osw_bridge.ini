# ==============================================================================
# OPENSIMWHEEL LINUX BRIDGE v1.4.0 - CONFIGURAZIONE CENTRALE
# Ogni simulatore ha una sezione dedicata e indipendente.
# ==============================================================================

# ------------------------------------------------------------------------------
# [IMPOSTAZIONI GENERALI HUB & RETE]
# ------------------------------------------------------------------------------
[HUB_SETTINGS]
versione = 1.4.0
porta_web_dashboard = 8080
auto_ripara_script_proton = true
rilascia_memoria_al_menu = true
chiusura_pulita_senza_kill = true

# ==============================================================================
# CONFIGURAZIONE SINGOLI SIMULATORI (SEZIONI SEPARATE)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ASSETTO CORSA (AC)
# ------------------------------------------------------------------------------
[SIM_AC]
nome = Assetto Corsa
appid = 244210
porta_udp = 9003
percorso_prefisso = auto
script_setup = ~/.local/share/OpenSimWheel/scripts/setup_ac_proton.sh
script_avvio_shm = auto
file_stop = stop_ac.flag

# ------------------------------------------------------------------------------
# 2. ASSETTO CORSA EVO (ACE)
# ------------------------------------------------------------------------------
[SIM_ACE]
nome = Assetto Corsa EVO
appid = 3058630
porta_udp = 9005
percorso_prefisso = auto
script_setup = ~/.local/share/OpenSimWheel/scripts/setup_ace_proton.sh
script_avvio_shm = auto
file_stop = stop_ace.flag

# ------------------------------------------------------------------------------
# 3. RACEROOM RACING EXPERIENCE (RRRE)
# ------------------------------------------------------------------------------
[SIM_RRRE]
nome = RaceRoom Racing Experience
appid = 211500
porta_udp = 9007
percorso_prefisso = auto
script_setup = ~/.local/share/OpenSimWheel/scripts/setup_rrre_proton.sh
script_avvio_shm = auto
file_stop = stop_rrre.flag

# ------------------------------------------------------------------------------
# 4. PROJECT MOTOR RACING (PRM)
# ------------------------------------------------------------------------------
[SIM_PRM]
nome = Project Motor Racing
appid = 299970
porta_udp = 9008
modalita = native_udp
file_stop = stop_prm.flag

# ------------------------------------------------------------------------------
# 5. ASSETTO CORSA COMPETIZIONE (ACC)
# ------------------------------------------------------------------------------
[SIM_ACC]
nome = Assetto Corsa Competizione
appid = 805550
porta_udp = 9004
percorso_prefisso = auto
script_setup = ~/.local/share/OpenSimWheel/scripts/setup_acc_proton.sh
script_avvio_shm = auto
file_stop = stop_acc.flag

# ------------------------------------------------------------------------------
# 6. LE MANS ULTIMATE (LMU - Plugin rF2)
# ------------------------------------------------------------------------------
[SIM_LMU]
nome = Le Mans Ultimate
appid = 2399420
porta_udp = 9009
percorso_prefisso = auto
script_setup = ~/.local/share/OpenSimWheel/scripts/setup_lmu_plugin.sh
script_avvio_shm = auto
file_stop = stop_lmu.flag

# ------------------------------------------------------------------------------
# 7. RFACTOR 2 (RF2 - Plugin rF2)
# ------------------------------------------------------------------------------
[SIM_RF2]
